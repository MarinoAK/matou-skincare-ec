<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品詳細 | MATOU</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="product-detail">
<div id="header"></div>

  <header class="product-detail-header">
    <a href="./products.html">商品一覧に戻る</a>
  </header>

  <main>
    <section class="product-detail-page">

      <img id="product-image" src="" alt="">
      <div class="product-detail-info">
        <p id="product-category">カテゴリー</p>
        <h1 id="product-name">商品名</h1>
        <p id="product-volume">内容量</p>
        <p id="product-price">価格</p>
        <p id="product-description">商品説明</p>
            <div class="accordion-item">
                <button class="accordion-button" id="usage-button" aria-expanded="false" aria-controls="product-usage">
                    使い方
                </button>
                <p class="accordion-content" id="product-usage" hidden>使い方</p>
            </div>

            <div class="accordion-item">
                <button class="accordion-button" id="ingredients-button" aria-expanded="false" aria-controls="product-ingredients">
                    成分
                </button>
                <p class="accordion-content" id="product-ingredients" hidden>成分</p>
            </div>

            <button class="add-to-cart-button">カートに入れる</button>
            <div class="cart-message" id="cart-message">
                <div class="cart-message-box">
                    <p>カートに追加しました</p>
                    <button class="cart-close-button" id="cart-close-button">
                    閉じる
                    </button>
                </div>
            </div>
      </div>

    </section>
  </main>

  <script type="module" src="/src/product-detail.ts"></script>
  <script type="module" src="../src/index.ts"></script>
</body>
</html>
